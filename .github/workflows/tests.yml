name: Simple CPU example
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python main.py --model linear
      - run: python -m unittest discover -s advanced/tests -v
      - run: python advanced/experiment.py --output-dir outputs/ci
      - run: python advanced/verify_results.py outputs/ci
      - run: python advanced/forecast.py data/sample/CLK1B_2025-06-01_to_2025-06-03_C.txt --satellite C --output outputs/future.csv
